# Desarrollo local: base de datos con PostGIS y la API.
# Uso:  cp .env.example .env  y luego  docker compose up --build
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: traveloaxaca
      POSTGRES_USER: ${DB_USER:-traveloaxaca}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}
    ports:
      - "5434:5432"
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-traveloaxaca} -d traveloaxaca"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Almacén de fotos para desarrollo: imita a S3 (adobe/s3mock). Las fotos se ven en http://localhost:9090/<bucket>/<clave>
  s3:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${S3_BUCKET:-traveloaxaca-medios}
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9090:9090"
    volumes:
      - medios:/s3mockroot

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/traveloaxaca
      DB_USER: ${DB_USER:-traveloaxaca}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:4200}
      JWT_SECRETO: ${JWT_SECRETO:-}
      URL_PORTAL: ${URL_PORTAL:-http://localhost:4200}
      CORREO_MODO: ${CORREO_MODO:-consola}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-no-responder@traveloaxaca.mx}
      ADMIN_CORREO: ${ADMIN_CORREO:-}
      ADMIN_CLAVE: ${ADMIN_CLAVE:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      S3_BUCKET: ${S3_BUCKET:-traveloaxaca-medios}
      S3_ENDPOINT: http://s3:9090
      S3_ENDPOINT_PUBLICO: http://localhost:9090
      S3_ACCESO_LLAVE: ${S3_ACCESO_LLAVE:-dev}
      S3_ACCESO_SECRETO: ${S3_ACCESO_SECRETO:-dev-secreto-123}
      S3_RUTA_ESTILO: "true"
      S3_URL_PUBLICA: http://localhost:9090/${S3_BUCKET:-traveloaxaca-medios}
    ports:
      - "${API_PUERTO:-8081}:8080"

volumes:
  datos:
  medios: